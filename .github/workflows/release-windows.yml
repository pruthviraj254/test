name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NEXT_PUBLIC_UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}

jobs:
  build-windows:
    name: Build NSIS installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build Next.js + NSIS installer
        shell: pwsh
        env:
          NEXT_PUBLIC_UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}
          UPDATE_PUBLISH_URL: ${{ vars.UPDATE_PUBLISH_URL }}
          UPDATE_CHANNEL: ${{ vars.UPDATE_CHANNEL || 'stable' }}
        run: npm run make

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Path out/make -Recurse | Select-Object FullName, Length

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            out/make/nsis/**/*.exe
            out/make/nsis/**/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/nsis/**/*.exe
            out/make/nsis/**/*.yml
          generate_release_notes: true
